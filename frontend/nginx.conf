server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca deve ficar em cache do navegador: e ele quem
    # referencia os assets com hash (JS/CSS) do build atual. Sem isso, um
    # navegador pode reter um index.html antigo (apontando para um bundle
    # antigo) mesmo depois de reconstruir e reiniciar o container.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Assets com hash no nome (Vite) podem ser cacheados agressivamente:
    # qualquer mudanca de conteudo gera um nome de arquivo novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
